[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bms"
version = "0.2.0"
description = "Wallinde boarding-school inspection and assurance API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "pydantic-settings>=2.7,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
bms = "bms.cli:main"
bms-scheduler = "bms.scheduling:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bms*"]

[tool.setuptools.package-data]
bms = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bms"]
